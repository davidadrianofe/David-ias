version: '3.8'

services:
  # Ollama - LLM Local
  ollama:
    image: ollama/ollama:latest
    container_name: david-ias-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    restart: unless-stopped
    networks:
      - david-ias-network

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: david-ias-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=mistral:latest
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ENVIRONMENT=production
    depends_on:
      - ollama
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - david-ias-network

  # Frontend - React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: david-ias-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - david-ias-network

volumes:
  ollama_data:
    driver: local

networks:
  david-ias-network:
    driver: bridge
